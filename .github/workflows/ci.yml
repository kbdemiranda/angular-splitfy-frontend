name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  build-unit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test -- --watch=false

  e2e-regression:
    runs-on: ubuntu-latest
    needs: build-unit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress regression
        run: npm run e2e

      - name: Upload Cypress artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-regression-artifacts
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: build-unit
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start backend dependencies
        run: docker compose up -d db backend

      - name: Wait for backend
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:9090/actuator/health >/dev/null 2>&1; then
              echo "Backend is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "Backend health endpoint did not respond in time"
          docker compose ps
          exit 1

      - name: Run Cypress smoke
        env:
          API_BASE_URL: http://localhost:9090
          CYPRESS_SMOKE_EMAIL: ${{ secrets.CYPRESS_SMOKE_EMAIL }}
          CYPRESS_SMOKE_PASSWORD: ${{ secrets.CYPRESS_SMOKE_PASSWORD }}
        run: npm run e2e:smoke

      - name: Upload Cypress artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-smoke-artifacts
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore

      - name: Print logs on failure
        if: failure()
        run: docker compose logs backend

      - name: Tear down backend dependencies
        if: always()
        run: docker compose down
