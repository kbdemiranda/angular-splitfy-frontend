<header class="sticky top-0 z-40 border-b border-slate-800 bg-slate-950 text-slate-100">
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6">
    <div class="flex items-center gap-3">
      <button
        type="button"
        class="inline-flex h-10 w-10 items-center justify-center rounded-lg border border-slate-700 bg-slate-900 text-slate-200 hover:bg-slate-800 sm:hidden"
        (click)="toggleMenu()"
        aria-label="Abrir menu"
      >
        <lucide-angular [img]="icons.menu" [size]="18"></lucide-angular>
      </button>
      <strong class="text-sm font-semibold tracking-wide text-cyan-300 sm:text-base">SPLITFY</strong>

      <nav class="ml-4 hidden items-center gap-1 sm:flex">
        @for (item of navItems; track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive="bg-slate-800 text-white"
            class="inline-flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-medium text-slate-300 hover:bg-slate-900 hover:text-white"
          >
            <lucide-angular [img]="item.icon" [size]="16"></lucide-angular>
            <span>{{ item.label }}</span>
          </a>
        }
      </nav>
    </div>

    <button
      type="button"
      class="hidden items-center gap-2 rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm font-medium text-slate-200 hover:bg-slate-800 sm:inline-flex"
      (click)="logout()"
    >
      <lucide-angular [img]="icons.logout" [size]="16"></lucide-angular>
      Sair
    </button>
  </div>

  <nav
    class="overflow-hidden border-t border-slate-800 bg-slate-950 transition-[max-height] duration-200 sm:hidden"
    [class.max-h-0]="!isMenuOpen"
    [class.max-h-96]="isMenuOpen"
  >
    <div class="mx-auto flex max-w-7xl flex-col px-3 py-3 sm:px-6">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-slate-800 text-white"
          class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-slate-300 hover:bg-slate-900 hover:text-white"
          (click)="closeMenu()"
        >
          <lucide-angular [img]="item.icon" [size]="16"></lucide-angular>
          <span>{{ item.label }}</span>
        </a>
      }

      <button
        type="button"
        class="mt-2 inline-flex items-center gap-3 rounded-lg px-3 py-2 text-left text-sm font-medium text-rose-300 hover:bg-rose-950/40 sm:hidden"
        (click)="logout()"
      >
        <lucide-angular [img]="icons.logout" [size]="16"></lucide-angular>
        Sair
      </button>
    </div>
  </nav>
</header>
