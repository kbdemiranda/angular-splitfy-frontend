<section class="login-page">
  <article class="login-card">
    <h1>Splitfy</h1>
    <p>Faça login para acessar o painel.</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label for="email">E-mail</label>
      <input id="email" type="email" formControlName="email" placeholder="email@splitfy.app" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small>E-mail inválido.</small>
      }

      <label for="password">Senha</label>
      <input id="password" type="password" formControlName="password" placeholder="Sua senha" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small>Senha obrigatória.</small>
      }

      <div class="error" *ngIf="invalidLogin">Login inválido</div>

      <button type="submit" [disabled]="submitting">
        {{ submitting ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>
  </article>
</section>
