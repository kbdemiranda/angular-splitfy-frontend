      type: object
      description: Reset password request payload
      properties:
        token:
          type: string
          description: Six-digit reset token
          example: 123456
          minLength: 1
          pattern: "^\\d{6}$"
        newPassword:
          type: string
          description: New password
          example: MyNewPass#2026
          maxLength: 128
          minLength: 8
          pattern: "^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d)(?=.*[^A-Za-z\\d]).{8,128}$"
      required:
      - newPassword
      - token
